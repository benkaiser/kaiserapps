server {
    listen 5000;
    server_name _;
    root /srv/kaiserapps;
    absolute_redirect off;
    server_tokens off;

    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        # $uri.html before $uri/ so /vidgrid is the product page while /vidgrid/* holds its subpages.
        try_files $uri $uri.html $uri/ =404;
    }
}
